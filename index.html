<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Strict policy (ORDER_FORM_SCOPE.md §4.8): only this site's own scripts, styles and
       images; no inline script or style; nothing is sent anywhere by the page. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; form-action 'none'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Order / Request for Quote</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <div class="company" id="company-name"></div>
      <h1 class="page-title">Order / Request for Quote</h1>
      <p class="intro" id="intro" hidden></p>
    </div>
  </header>

  <main class="wrap" id="app">
    <section class="card" id="customer" aria-label="Your information"></section>
    <section class="card" id="parts" aria-label="Parts"></section>
    <div class="panel error" id="problems" tabindex="-1" role="alert" aria-live="assertive" hidden></div>
    <div class="panel warn" id="send-notice" aria-live="polite" hidden></div>
    <div class="panel next" id="next-step" aria-live="polite" hidden></div>
    <div class="draft-row">
      <span class="hint" id="draft-status"></span>
      <button type="button" class="btn-link" id="start-over">Start over</button>
    </div>
    <!-- Hidden picker for attaching/replacing one line's file. -->
    <input type="file" id="single-picker" accept=".dxf,.step,.stp" class="visually-hidden" tabindex="-1" aria-hidden="true">
  </main>

  <div class="sendbar" id="sendbar"></div>

  <footer class="footer wrap">
    <div>Your files stay on your device until you send them to us.</div>
    <div class="hint"><span id="form-version"></span> · <span id="link-stamp"></span></div>
  </footer>
</body>
</html>
